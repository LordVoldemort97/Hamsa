<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر همسة | سلة المشتريات</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">🌸 متجر همسة</a>
        <div class="nav-links">
            <a href="index.html">الرئيسية</a>
            <a href="product.html?id=5" class="custom-design-link">تصميم خاص ✨</a>
            <a href="cart.html" class="cart-icon">
                السلة <span class="cart-count">0</span>
            </a>
        </div>
    </header>

    <div class="container">
        <h2 class="title-page">سلة المشتريات</h2>
        
        <div class="cart-table-container">
            <table class="cart-table">
                <thead>
                    <tr>
                        <th>المنتج</th>
                        <th>الاسم</th>
                        <th>السعر</th>
                        <th>الكمية</th>
                        <th>المجموع</th>
                        <th>إزالة</th>
                    </tr>
                </thead>
                <tbody id="cart-body"></tbody>
            </table>
        </div>

        <div class="cart-summary">
            <h3>الإجمالي: <span id="cart-total" style="color: #e74c3c;">0</span> ريال</h3>
            <a href="checkout.html" class="btn" id="checkout-btn" style="width: auto;">إتمام الطلب الآن</a>
        </div>
    </div>

    <footer>جميع الحقوق محفوظة لمتجر همسة &copy; 2026</footer>
    <script src="main.js"></script>
</body>
</html>
